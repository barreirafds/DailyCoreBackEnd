info:
  name: Create Routine
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/routines
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Morning Routine",
        "description": "My daily morning habits",
        "userId": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
