info:
  name: Create Tasks
  type: http
  seq: 6

http:
  method: POST
  url: http://localhost:8080/api/routines/{{routineId}}/tasks
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "title": "Drink water"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
