info:
  name: Update Profile
  type: http
  seq: 5

http:
  method: PUT
  url: http://localhost:8080/api/auth/me
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Diego",
        "email": "diego@example.com",
        "phoneNumber": "+351900000000"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
